<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pessoas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 rounded shadow-sm">
        <h2 class="mb-3">Pessoas Cadastradas</h2>

        <!-- Lista de itens -->
        <ul class="list-group mb-3">
            {% for person in people %} <!--Laço de repetição-->
                <li class="list-group-item">{{ person }}</li> <!--A chaves duplas forçam o Django a imprimir o valor em texto-->
            {% empty %} <!--Executa o código abaixo caso de nulo ou nao encontrar nenhuma pessoa nesse caso-->
                <li class="list-group-item text-muted">Nenhuma pessoa cadastrada no momento.</li>
            {% endfor %} <!--Encerra o laço-->
        </ul>

    </div>
</body>
</html>
