{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <a href="{% url 'community:feed' %}">Voltar ao mural</a>
    <h1>{{ post.title }}</h1>
    <p>{{ post.get_category_display }} · {{ post.author.username }}</p>
    {{ post.content|linebreaks }}

    {% if post.author == user %}
    <a href="{% url 'community:edit' post.pk %}">Editar</a>
    <a href="{% url 'community:delete' post.pk %}">Excluir</a>
{% endif %}
{% endblock %}
