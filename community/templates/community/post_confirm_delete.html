{% extends "base.html" %}

{% block content %}
    <h1>Excluir publicação</h1>
    <p>Deseja excluir “{{ post.title }}”?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
    </form>

    <a href="{% url 'community:detail' post.pk %}">Cancelar</a>
{% endblock %}
