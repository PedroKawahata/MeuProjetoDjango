<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Meu Projeto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0">Criar Nova Conta</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %} <!-- ficha de token invisivel que impede ataques, Django rejeita qualquer envio sem essa tag !-->
                            {{ form.as_p }} <!--Instrui o Django a automaticamente desenhar os campos do formulário Login e Senha formatados dentro de paragráfos <p> -->
                            <button type="submit" class="btn btn-success w-100 mt-3">Cadastrar</button>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3 bg-white">
                        <small>Já possui uma conta? <a href="{% url 'accounts:login' %}">Voltar para Login</a></small> <!--Gera o caminho relativo caso a url mude no futuro-->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
